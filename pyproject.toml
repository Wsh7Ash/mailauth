[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mailauth-skill"
version = "1.0.0"
description = "One production-grade skill for authorized SPF/DKIM/DMARC assessment, plus a contract checker that proves the skill file is structurally complete."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Wsh7Ash" }]
keywords = ["email-security", "spf", "dkim", "dmarc", "skills", "agent-skills"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mailauth = "mailauth_skill.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
